name: offline-gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: milk-gateway-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt

      - name: Install pinned Node dependencies
        run: |
          npm ci --ignore-scripts
          npm --prefix deploy/cloudflare ci --ignore-scripts

      - id: rust
        name: Rust fmt, tests, and clippy
        run: |
          cargo +1.95.0 fetch --locked
          cargo +1.95.0 fmt --all -- --check
          cargo +1.95.0 test --locked --offline --workspace
          cargo +1.95.0 clippy --locked --offline --workspace --all-targets -- -D warnings

      - id: contracts
        name: Node, Cloudflare, release, and shell contracts
        run: |
          npm test
          node tools/openai-production-smoke.test.mjs
          npm --prefix deploy/cloudflare test
          python3 tools/test_manage_candidate_credential.py
          python3 tools/test_private_build.py
          python3 tools/test_deploy_private_gateway.py
          bash deploy/dragontales-key.test.sh
          bash deploy/dragontales-publish-route.test.sh
          sh -n tools/build-private-gateway.sh tools/deploy-private-gateway.sh

      - name: Write content-free CI receipt
        if: always()
        env:
          RUST_OUTCOME: ${{ steps.rust.outcome }}
          CONTRACTS_OUTCOME: ${{ steps.contracts.outcome }}
        run: |
          install -d -m 0700 ci-evidence
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          value = {
              "schema_version": "milk.private-ci-ops-log-reference.v1",
              "source_commit": os.environ["GITHUB_SHA"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "ops_log_authority": "private-github-actions-run",
              "ops_log_reference": f"actions/runs/{os.environ['GITHUB_RUN_ID']}/attempts/{os.environ['GITHUB_RUN_ATTEMPT']}",
              "immutable": True,
              "content_free_receipt": True,
              "rust_outcome": os.environ.get("RUST_OUTCOME", "skipped"),
              "contracts_outcome": os.environ.get("CONTRACTS_OUTCOME", "skipped"),
          }
          Path("ci-evidence/receipt.json").write_text(
              json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Retain private CI receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: milk-gateway-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence/receipt.json
          if-no-files-found: error
          retention-days: 30
