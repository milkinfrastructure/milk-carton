[workspace]
members = ["crates/milk-carton"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
actix-web = "4.9.0"
anyhow = "1.0.100"
async-trait = "0.1.89"
base64 = "0.22.1"
bytes = "1.10.1"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.48", features = ["derive", "env"] }
futures = "0.3.31"
object_store = { version = "0.12.5", features = ["fs", "aws"] }
reqwest = { version = "0.12.23", default-features = false, features = [
  "json",
  "rustls-tls",
  "stream",
] }
ring = "0.17.14"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["raw_value"] }
sha2 = "0.10.9"
subtle = "2.6.1"
tokio = { version = "1.52.1", features = [
  "io-std",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "sync",
  "time",
] }
tracing = "0.1.44"
tracing-subscriber = "0.3.20"
url = "2.5.7"
uuid = { version = "1.18.1", features = ["serde", "v4", "v7"] }
zstd = "0.13.3"
